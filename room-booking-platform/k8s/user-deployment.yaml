apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
      annotations:
        #sidecar.istio.io/inject: "false"
    spec:
      spec:
      serviceAccountName: booking-app
      imagePullSecrets:
      - name: regcred
      containers:
      - name: user-service
        image: camelia4/user-service:1.0
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "kubernetes"
        ports:
        - containerPort: 3000