apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-room-pv
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: "/mnt/data/postgres-room"  # Ce chemin doit exister sur le nœud