server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: room-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/roomdb}
    username: ${DB_USER:roomuser}
    password: ${DB_PASSWORD:roompass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  h2:
    console:
      enabled: true
      path: /h2-console


management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.booking: DEBUG